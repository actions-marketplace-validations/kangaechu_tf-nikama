# Example nikama.yml
#
# The schema is the supported subset of Digger's digger.yml. Unsupported keys
# (terragrunt, pulumi, backend-only settings) are rejected at load time.

projects:
  - name: network
    dir: infra/network
  - name: app
    dir: infra/app
    depends_on: [network]
    workflow: with_vars
  - name: app-staging
    dir: infra/app
    workspace: staging
    depends_on: [network]
    workflow: with_vars
    # Regular expression matched against the pull request's base branch;
    # the project is impacted only by PRs into a matching branch.
    branch: ^develop$
    # Checks run before `digger apply` (default: [mergeable]). Each value is
    # enforced independently:
    #   mergeable  - GitHub reports the PR as mergeable (no conflicts, required
    #                checks green); skipped by workflow_configuration.skip_merge_check
    #   approved   - at least one approving review from a user with write
    #                access other than the PR author, and no outstanding
    #                "changes requested" (reviews from other users are ignored)
    #   undiverged - the PR branch is not behind its base branch
    apply_requirements: [approved, mergeable, undiverged]
    aws_role_to_assume:
      aws_role_region: ap-northeast-1
      state: arn:aws:iam::123456789012:role/tf-state
      command: arn:aws:iam::123456789012:role/tf-apply

generate_projects:
  blocks:
    - block_name: services
      include: "services/**"
      exclude: "services/_shared/**"
      workflow: default

workflows:
  default: null # built-in: plan = [init, plan], apply = [init, apply]
  with_vars:
    env_vars:
      state:
        - name: AWS_REGION
          value: ap-northeast-1
      commands:
        - name: TF_VAR_api_key
          value_from: API_KEY
    plan:
      steps:
        - init:
            extra_args: ["-upgrade"]
        - plan:
            extra_args: ["-var-file=env.tfvars"]
        - run: "echo plan finished for $PROJECT_NAME >> $NIKAMA_OUT"
    apply:
      steps:
        - init
        - apply
    workflow_configuration:
      on_pull_request_pushed: ["digger plan"]
      on_pull_request_closed: ["digger unlock"]
      on_commit_to_default: ["digger unlock"]

# When project locks are taken: on_plan (default; true) locks on the first
# plan, on_apply only on apply (plans never block other PRs), disabled
# (false) never. Pair on_apply with `apply_requirements: [undiverged, ...]`.
pr_locks: on_plan
# PRs with this label are planned without taking project locks
# (e.g. the label Renovate / Dependabot adds to version bumps).
no_lock_label: no-lock
# Treat local modules referenced from a project (`source = "../modules/x"`,
# followed transitively) as part of the project when computing impacted
# projects. Default: false.
autoplan_modules: true
# Arguments a comment may pass to `terraform plan` after `--`
# (`nikama plan -p app -- -target=module.vpc`). Each argument must match one
# pattern on its own; `*` matches anything. Empty (default): `--` is refused.
allowed_plan_args:
  - "-target=*"
  - "-replace=*"
  - "-refresh=false"
# Word(s) a PR comment must start with to be treated as a command. A string
# or a list; the first one is used in help texts. Default: [nikama, digger].
# wakeup_word: [nikama, digger]
auto_merge: false
dependency_configuration:
  mode: hard

concurrency:
  max_parallel: 4
  apply_parallelism: 1

comment:
  mode: single        # single | per_project | latest
  show_empty_plans: table

# Providers this configuration may install. Only narrows the workflow's
# `allowed-providers` input; entries outside it are ignored.
allowed_providers:
  - hashicorp/aws
  - hashicorp/random
