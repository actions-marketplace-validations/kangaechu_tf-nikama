version: 2
updates:
  # GitHub Actions: workflow 内の action バージョン更新。
  # actions.lock に登録済みの workflow は、同じ PR 内で lockfile のエントリも更新される。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns: ["*"]

  # Cargo: minor / patch はまとめて 1 PR、major は個別 PR
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
